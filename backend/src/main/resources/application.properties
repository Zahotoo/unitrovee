spring.application.name=unitrovee

# --- Datasource (read from env: password should be provided from env) ---
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:unitrovee}
spring.datasource.username=${POSTGRES_USER:unitrovee}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Actuator health: show component details at /actuator/health
management.endpoint.health.show-details=always

# activate the "local" profile so LocalStorageService is the active StorageService
spring.profiles.active=local

# local file storage settings
storage.local.directory=uploads
storage.local.base-url=http://localhost:8080/files

# --- JWT ---
jwt.secret=${JWT_SECRET:dev-only-jwt-secret-change-me-in-production-0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS ---
# Local Vite frontend by default; override in deployment with FRONTEND_ORIGIN
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}